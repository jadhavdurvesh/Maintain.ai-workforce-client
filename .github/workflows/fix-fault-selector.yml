name: Apply fault selector UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch machine selector
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          path = Path("lib/main.dart")
          text = path.read_text()
          pattern = r"                DropdownButtonFormField<int>\(\n                  value: selectedMachine,\n                  decoration: const InputDecoration\(labelText: 'Machine', prefixIcon: Icon\(Icons\.precision_manufacturing\)\),\n                  items: machines\.map\(\(machine\) => DropdownMenuItem<int>\(value: machine\['id'\] as int, child: Text\('\$\{machine\['name'\]\} \(\$\{machine\['machine_code'\]\}\)'\)\)\)\.toList\(\),\n                  onChanged: \(value\) \{ if \(value != null\) setSheetState\(\(\) => selectedMachine = value\); \},\n                \),"
          new = """                DropdownButtonFormField<int>(
                  value: selectedMachine,
                  isExpanded: true,
                  decoration: const InputDecoration(
                    labelText: 'Machine',
                    prefixIcon: Icon(Icons.precision_manufacturing),
                  ),
                  selectedItemBuilder: (context) => machines
                      .map((machine) => Align(
                            alignment: Alignment.centerLeft,
                            child: Text(
                              '${machine['name']} (${machine['machine_code']})',
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                            ),
                          ))
                      .toList(),
                  items: machines
                      .map((machine) => DropdownMenuItem<int>(
                            value: machine['id'] as int,
                            child: Text(
                              '${machine['name']} (${machine['machine_code']})',
                              maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                            ),
                          ))
                      .toList(),
                  onChanged: (value) { if (value != null) setSheetState(() => selectedMachine = value); },
                ),"""
          patched, count = re.subn(pattern, new, text, count=1)
          if count != 1:
              raise SystemExit("machine selector block not found")
          path.write_text(patched)
          PY2
      - name: Commit UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'Fix fault report machine selector overflow'
          git push
