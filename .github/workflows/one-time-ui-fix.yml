name: One-time UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time UI patch'
    runs-on: ubuntu-latest
    steps:
      - name: Patch main.dart
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'lib/main.dart';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            const content = Buffer.from(data.content, 'base64').toString('utf8');

            if (content.includes("import 'machine_details_page.dart';")) {
              core.setFailed('Machine details import already exists; refusing to modify twice.');
              return;
            }

            let updated = content.replace(
              "import 'package:shared_preferences/shared_preferences.dart';\n",
              "import 'package:shared_preferences/shared_preferences.dart';\nimport 'machine_details_page.dart';\n"
            );

            const oldTile = `  Widget _machineTile(Map<String, dynamic> machine) {
    final health = _number(machine['health_score']);

    final color = health >= 70
        ? Colors.greenAccent
        : health >= 40
            ? Colors.amberAccent
            : Colors.redAccent;

    return Card(
      margin: const EdgeInsets.only(bottom: 10),
      child: ListTile(
        leading: CircleAvatar(
          backgroundColor: color.withOpacity(.12),
          child: Icon(
            Icons.precision_manufacturing,
            color: color,
          ),
        ),
        title: Text(
          '\${machine['name'] ?? 'Machine'}',
          style: const TextStyle(fontWeight: FontWeight.w700),
        ),
        subtitle: Text(
          '\${machine['machine_code'] ?? '—'} • '
          '\${machine['location'] ?? '—'}',
          style: const TextStyle(color: Colors.white54),
        ),
        trailing: Text(
          '\${health.toStringAsFixed(0)}%',
          style: TextStyle(
            color: color,
            fontWeight: FontWeight.w900,
          ),
        ),
      ),
    );
  }
`;

            const newTile = `  Widget _machineTile(Map<String, dynamic> machine) {
    final health = _number(machine['health_score']);

    final color = health >= 70
        ? Colors.greenAccent
        : health >= 40
            ? Colors.amberAccent
            : Colors.redAccent;

    return Card(
      margin: const EdgeInsets.only(bottom: 10),
      child: ListTile(
        onTap: () {
          Navigator.of(context).push(
            MaterialPageRoute(
              builder: (_) => MachineDetailsPage(
                api: widget.api,
                machine: machine,
              ),
            ),
          );
        },
        leading: CircleAvatar(
          backgroundColor: color.withOpacity(.12),
          child: Icon(Icons.precision_manufacturing, color: color),
        ),
        title: Text(
          '\${machine['name'] ?? 'Machine'}',
          style: const TextStyle(fontWeight: FontWeight.w700),
        ),
        subtitle: Text(
          '\${machine['machine_code'] ?? '—'} • '\n          '\${machine['location'] ?? '—'}',
          style: const TextStyle(color: Colors.white54),
        ),
        trailing: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Text(
              '\${health.toStringAsFixed(0)}%',
              style: TextStyle(color: color, fontWeight: FontWeight.w900),
            ),
            const SizedBox(width: 6),
            const Icon(Icons.chevron_right, color: Colors.white38),
          ],
        ),
      ),
    );
  }
`;

            if (!updated.includes(oldTile)) {
              core.setFailed('Expected machine tile was not found.');
              return;
            }
            updated = updated.replace(oldTile, newTile);

            const oldNav = `      bottomNavigationBar: NavigationBar(
        selectedIndex: tab,
        onDestinationSelected: (index) {
          setState(() {
            tab = index;
          });
        },
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.dashboard_outlined),
            selectedIcon: Icon(Icons.dashboard),
            label: 'Home',
          ),
          NavigationDestination(
            icon: Icon(Icons.precision_manufacturing_outlined),
            selectedIcon: Icon(Icons.precision_manufacturing),
            label: 'Machines',
          ),
          NavigationDestination(
            icon: Icon(Icons.assignment_outlined),
            selectedIcon: Icon(Icons.assignment),
            label: 'Work Orders',
          ),
          NavigationDestination(
            icon: Icon(Icons.report_problem_outlined),
            selectedIcon: Icon(Icons.report_problem),
            label: 'Faults',
          ),
          NavigationDestination(
            icon: Icon(Icons.person_outline),
            selectedIcon: Icon(Icons.person),
            label: 'Profile',
          ),
        ],
      ),
`;

            const newNav = `      bottomNavigationBar: SafeArea(
        minimum: const EdgeInsets.fromLTRB(12, 0, 12, 12),
        child: Container(
          height: 68,
          decoration: BoxDecoration(
            color: const Color(0xFF111D2E),
            borderRadius: BorderRadius.circular(24),
            border: Border.all(color: Colors.white.withOpacity(.07)),
            boxShadow: [
              BoxShadow(
                color: Colors.black.withOpacity(.28),
                blurRadius: 24,
                offset: const Offset(0, 8),
              ),
            ],
          ),
          padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 6),
          child: Row(
            children: [
              _navItem(0, Icons.dashboard_outlined, Icons.dashboard, 'Home'),
              _navItem(1, Icons.precision_manufacturing_outlined, Icons.precision_manufacturing, 'Machines'),
              _navItem(2, Icons.assignment_outlined, Icons.assignment, 'Work'),
              _navItem(3, Icons.report_problem_outlined, Icons.report_problem, 'Faults'),
              _navItem(4, Icons.person_outline, Icons.person, 'Profile'),
            ],
          ),
        ),
      ),
`;

            if (!updated.includes(oldNav)) {
              core.setFailed('Expected navbar was not found.');
              return;
            }
            updated = updated.replace(oldNav, newNav);

            const marker = '  Widget _dashboardPage() {';
            const navMethod = `  Widget _navItem(int index, IconData icon, IconData selectedIcon, String label) {
    final selected = tab == index;
    return Expanded(
      child: InkWell(
        borderRadius: BorderRadius.circular(18),
        onTap: () => setState(() => tab = index),
        child: AnimatedContainer(
          duration: const Duration(milliseconds: 180),
          margin: const EdgeInsets.symmetric(horizontal: 2),
          decoration: BoxDecoration(
            color: selected ? Colors.lightBlueAccent.withOpacity(.13) : Colors.transparent,
            borderRadius: BorderRadius.circular(18),
          ),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Icon(selected ? selectedIcon : icon, size: 22, color: selected ? Colors.lightBlueAccent : Colors.white54),
              const SizedBox(height: 3),
              Text(label, style: TextStyle(fontSize: 10, fontWeight: selected ? FontWeight.w800 : FontWeight.w600, color: selected ? Colors.lightBlueAccent : Colors.white54)),
            ],
          ),
        ),
      ),
    );
  }

`;

            if (!updated.includes(marker)) {
              core.setFailed('Dashboard marker was not found.');
              return;
            }
            updated = updated.replace(marker, navMethod + marker);

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Add machine details navigation and refresh navbar',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: data.sha,
              branch: 'main'
            });

            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/workflows/one-time-ui-fix.yml',
              message: 'Remove one-time UI fix workflow',
              sha: '22c4546aafb782cdec2dfae84b6fbb961dbc6e36',
              branch: 'main'
            });
