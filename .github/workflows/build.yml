name: Build Workforce Client

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  PROJECT_NAME: "maintain_ai_workforce_client"

jobs:
  analyze:
    name: Analyze Flutter App

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform projects
        run: |
          flutter create \
            --project-name ${{ env.PROJECT_NAME }} \
            --platforms=android,ios \
            .

      - name: Remove generated example test
        run: |
          rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  android:
    name: Build Android APK

    needs: analyze

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android project
        run: |
          flutter create \
            --project-name ${{ env.PROJECT_NAME }} \
            --platforms=android \
            .

      - name: Ensure Android INTERNET permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise SystemExit(
                  f"AndroidManifest.xml not found: {path}"
              )

          content = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in content:
              marker = '<application'

              if marker not in content:
                  raise SystemExit(
                      "Could not find <application> "
                      "in AndroidManifest.xml"
                  )

              content = content.replace(
                  marker,
                  f'    {permission}\n\n    {marker}',
                  1,
              )

              path.write_text(content)

          print("Android INTERNET permission verified.")

          print("--- AndroidManifest.xml ---")
          print(path.read_text())
          print("--- End manifest ---")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workforce-client-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS

    needs: analyze

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS project
        run: |
          flutter create \
            --project-name ${{ env.PROJECT_NAME }} \
            --platforms=ios \
            .

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: |
          mkdir -p artifacts

          cp -R \
            build/ios/iphoneos/Runner.app \
            artifacts/WorkforceClient.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: workforce-client-ios-app-unsigned
          path: artifacts/WorkforceClient.app
